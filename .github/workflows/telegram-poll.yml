name: Telegram Poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Poll Telegram and update pending.csv
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TOKEN_ARTISTI: ${{ secrets.TELEGRAM_TOKEN_ARTISTI }}
        run: bash scripts/poll.sh

      - name: Process queue with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/process.py

      - name: Commit changes if any
        run: |
          mkdir -p pending/images
          touch pending/tg_offset.txt
          touch pending/tg_offset_artisti.txt
          [ -f pending.csv ] || echo "timestamp,text" > pending.csv
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add pending.csv pending/tg_offset.txt pending/tg_offset_artisti.txt pending/images/ data.csv artisti-visual.csv pending/debug.log pending/poll_debug.log
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiornamento automatico da Telegram"
            git push
          fi
