name: Telegram Poll

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Poll Telegram and update pending.csv
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: bash scripts/poll.sh

      - name: Commit changes if any
        run: |
          mkdir -p pending
          touch pending/tg_offset.txt
          [ -f pending.csv ] || echo "timestamp,text" > pending.csv
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add pending.csv pending/tg_offset.txt
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiornamento coda Telegram"
            git push
          fi
